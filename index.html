ния",desc:"Мгновенно лечит союзников на 75% и снимает с них болезни.",cd:30,dur:0}},{id:"paladin",name:"Паладин",blurb:"Священная сталь. След — золотой.",trail:{glow:"#ffb800",mid:"#ffd84d",core:"#fff6c2"},ui:"#ffd34d",ability:{name:"Щит веры",desc:"На 8 сек. ваши воины неуязвимы — и их можно рубить без наказания.",cd:34,dur:8}},{id:"druid",name:"Друид",blurb:"Сила природы. След — зелёный.",trail:{glow:"#2fbf4a",mid:"#6fe06b",core:"#e6ffe0"},ui:"#5fd35f",ability:{name:"Корни земли",desc:"На 7 сек. корни опутывают врагов, сильно замедляя их.",cd:30,dur:7}},{id:"warlock",name:"Чернокнижник",blurb:"Кровавые души. След — красный.",trail:{glow:"#d11a1a",mid:"#ff4a4a",core:"#ffd0d0"},ui:"#ff3b3b",ability:{name:"Пожирание душ",desc:"На 10 сек. души убитых врагов лечат ваших союзников.",cd:32,dur:10}},{id:"necro",name:"Некромант",blurb:"Власть над мёртвыми. След — чёрный.",trail:{glow:"#7a2cff",mid:"#15121c",core:"#5b2aa8"},ui:"#6b3fb0",ability:{name:"Восстание мёртвых",desc:"Павшие враги на 15 сек. встают на вашу сторону.",cd:36,dur:15}}],pi=a=>Ls.find(i=>i.id===a)??Ls[0],l2=[{paths:[[[.5,.04],[.5,.14],[.2,.22],[.2,.34],[.78,.42],[.78,.54],[.3,.62],[.5,.72],[.5,.8]]]},{paths:[[[.85,.04],[.85,.16],[.25,.24],[.15,.36],[.6,.44],[.85,.52],[.75,.64],[.5,.7],[.5,.8]]]},{paths:[[[.15,.04],[.15,.18],[.7,.22],[.82,.34],[.35,.4],[.18,.52],[.4,.62],[.5,.7],[.5,.8]]]},{paths:[[[.2,.04],[.2,.26],[.45,.38],[.5,.55],[.5,.8]],[[.8,.04],[.8,.26],[.55,.38],[.5,.55],[.5,.8]]]},{paths:[[[.5,.04],[.5,.12],[.82,.2],[.82,.3],[.18,.38],[.18,.48],[.82,.56],[.8,.64],[.5,.72],[.5,.8]]]},{paths:[[[.12,.04],[.12,.3],[.4,.42],[.5,.6],[.5,.8]],[[.88,.04],[.88,.3],[.6,.42],[.5,.6],[.5,.8]]]}],Js=[{name:"Акт I · Тени Жатвы",sub:"Первые города под ударом"},{name:"Акт II · Восемь Печатей",sub:"Мастера Душ и ключи силы"},{name:"Акт III · Пепел и Песок",sub:"Пустыни, вулканы, проклятые земли"},{name:"Акт IV · Королевства Гор",sub:"Дворфы, гномы, лепреконы и эльфы"},{name:"Акт V · Последний рассвет",sub:"Некрополь Личерон и осада Ксарота"}],t2="В начале был лишь Высший Свет, и из него родился Филакт. Но Подземная Владычица Хален создала Императора-лича Ксанвиса — а тьма не терпит хозяев. Ксанвис восстал и поднял Жатву: упырей, зомби, личей, рыцарей смерти, сшивней, горгулий и костелётов. Вы — защитник зелёно-золотого Ксарота, чьё знамя украшает золотой дракон. Ведите стражей, рубите нежить — и спасите города Филакта.",a2=[["Ксарот","xarot","Первая ночь Жатвы","meadow","g","Зелёно-золотой Ксарот спит под знаменем золотого дракона. На закате из тумана выходят первые упыри Жатвы. Проведите пальцем по врагу — клинок отсечёт всё, что нужно.","Ксарот устоял. Но это лишь разведка — Жатва идёт дальше."],["Сенория","senoria","Страж севера","meadow","gz","Старейшина Орн триста лет хранит Сенорию. После гибели голема Грима он больше не берёт меча, лишь учит молодёжь. Теперь город просит помощи Ксарота.","Орн кивает: «Достойный ученик». Сенория цела."],["Сенория","senoria","Первый трофей","meadow","gzz","Ловчий Кейр потерял волка Серого в Тёмном лесу. Пока он ищет следы, по тракту бредут зомби, а среди них — беженцы. Не заденьте своих!","Кейр нашёл след Серого. Надежда жива."],["Сенория","senoria","Ингредиенты для рун","meadow","gzz","Кузнец Белегар мечтает выковать рунный клинок, но твари нынче редки. Нежить принесла ему кости — и осаду. Удержите стены.","Белегар получил кости и клянётся выковать вам клинок."],["Зиффрен","ziffren","Караваны мёртвых","plains","gzr","В Зиффрене гоблины-воры грабили караваны. Теперь караваны грабит сама Смерть, а над дорогой кружат горгульи.","Караван дошёл до ворот Зиффрена."],["Зиффрен","ziffren","Шёпот Печатей","plains","gzrr","Мастер Земли Кутар слышит шёпот Печатей: Жатва ищет ключи к силе Филакта. Не дайте мертвецам добраться до хранилища.","Хранилище Печатей осталось нетронутым."],["Тропа Странников","trail","Зачистка тракта","plains","gzrs","Торговый путь кишит тварями. Крысиный владыка бежал, зато пришли сшивни — мясники Ксанвиса с крюками и тесаками.","Тракт расчищен. Странники снова в пути."],["Тёмный Лес","darkwood","Грибная напасть","forest","gzzs","Микониды заражены чумой мёртвых и несут споры. Из чащи ползут упыри и зомби, а за ними хромают первые личи.","Споры сожжены. Лес дышит свободнее."],["Тёмный Лес","darkwood","Пробуждение Древня","forest","gzzl","Древень проснулся, но личи уже тянутся к нему чёрной магией. Они воскрешают павших — рубите трупы, чтобы те не встали снова.","Древень уснул вновь, окружённый живым лесом."],["Зарадат","zaradat","Мертвяк Хаарг","arcane","gzl","Город магов и големов. Мастер Камня Торвальд держит оборону, но из тьмы ползёт Мертвяк Хаарг — чудовище из сотни трупов. Рубите его по частям!","Хаарг рассыпался на куски. Торвальд готов вручить Печать Камня.","hargh"],["Зарадат","zaradat","Печать Камня","arcane","gzlk","Хаарг повержен, и Торвальд вручает вам Печать Камня. Но на стены уже лезут рыцари смерти: броню не пробить одним ударом — сперва ранения, потом клинок.","Печать Камня у вас. Семь Печатей ещё ждут."],["Гора Звёзд","starmount","Восхождение","mountain","gzkr","Каменные големы расступились, а по склонам ползёт нежить. Осколок упавшей звезды дрожит в руках — Жатва идёт именно за ним.","Осколок звезды спасён."],["Чонод","chonod","Песнь сирен","coast","zlrg","Сирены Чонода заманивали моряков, теперь поют для мёртвых. Утопленники встают с морского дна и идут к городским воротам.","Песнь стихла. Сирены снова поют для живых."],["Чонод","chonod","Печать Воды","coast","zlsk","Мастер Аэлин отдаёт Печать Воды, но шторм принёс на причалы сшивней. Защитите порт и потерянного морского конька — реликвию Чонода.","Печать Воды в ваших руках."],["Паландир","palandir","Испытание Грозы","mountain","gzkc","Над Паландиром гремит гроза, а в тучах — костелёты, костяные вертолёты Жатвы. Перерубите винт — и машина рухнет на землю.","Гроза утихла, небо очистилось."],["Паландир","palandir","Печать Молнии","mountain","rclk","Заррок ждёт вас с Печатью Молнии. Но небо чёрно от горгулий и костелётов. Целитесь вверх!","Печать Молнии ваша. Четыре осталось."],["Селаксар","selaxar","Хранители рощи","forest","gzls","Дриады прячутся в кронах, а в корнях копошатся упыри. Роща Селаксара стонет под топотом мёртвых.","Дриады вышли из крон и поют вам хвалу."],["Селаксар","selaxar","Дух-Лисичка","forest","zklc","Дух-Лисичка бежит с Печатью Природы, которую доверила ей Элирия. За ней гонятся рыцари смерти — прикройте беглянку.","Элирия вручает Печать Природы."],["Фатолодор","fatolodor","Пожиратели разума","swamp","glkr","Мозгоеды Фатолодора шепчут во снах. Мёртвые не слышат шёпота — и потому идут вперёд, не останавливаясь.","Шёпот смолк. Разум Фатолодора чист."],["Фатолодор","fatolodor","Архилич Малкрин","swamp","zlk","Сабирель молит о помощи: Архилич Малкрин, древний повелитель мёртвых, поднимает павших быстрее, чем вы их рубите. Не оставляйте целых трупов!","Малкрин пал. Сабирель отдаёт Печать Разума.","malkrin"],["Тотсар","totsar","Изгнание духов","swamp","zlkc","Город, проклятый бесплотными духами, держится лишь на стенах. Мёртвые идут без счёта, а над башнями кружат костелёты.","Духи изгнаны. Тотсар вздохнул."],["Тотсар","totsar","Плач банши","swamp","gklrc","Крик банши замедляет живых, и защитники устали. Нужны острый клинок и быстрые руки.","Плач стих — до следующей ночи."],["Пещера Душ","soulcave","Тёмные глубины","cave","gzks","Вампиры и личи Пещеры Душ отдали ключи Ксанвису. Факелы гаснут один за другим.","Факелы снова горят."],["Пещера Душ","soulcave","Гнездо Вампи","cave","lksc","В гнезде Вампи спят яйца, и тьма хочет их себе. Лич за личом выходит из мглы, поднимая мёртвых.","Гнездо сохранено."],["Урион","urion","Мастер Сафари","forest","zskrc","Когар, Мастер Теней, охотился на драконов; теперь охотятся на него. Печать Теней — главная цель Жатвы.","Когар вручает Печать Теней. «Охота окончена»."],["Пески Забвения","sands","Песчаная буря","desert","gzkcr","Мумии и песчаные тролли присягнули Императору. Буря скрывает врагов, но не беженцев: будьте осторожны.","Буря улеглась, пески чисты."],["Пески Забвения","sands","Гробница Фараона","desert","zlksc","Гробница Фараона вскрыта изнутри. Стражи пустыни стали солдатами Жатвы.","Гробница запечатана."],["Остров Хэдрон","hedron","Восход Феникса","volcano","gklrc","Перья Огненного Феникса — последняя надежда острова. Нежить рвётся к гнезду по обугленным тропам.","Феникс взмыл над островом."],["Гозон","gozon","Ярость вулкана","volcano","kscrl","Брайнер хранит Печать Пламени. Вулкан извергается, а из пепла встают обугленные мертвецы.","Брайнер отдаёт Печать Пламени."],["Гозон","gozon","Лорд Мордрейн","volcano","kkzs","Лорд-рыцарь смерти Мордрейн, правая рука Императора, жжёт Гозон. Его броня поддаётся лишь тогда, когда он ранен.","Мордрейн повержен. Его доспехи остыли.","mordrein"],["Острова Побеждённого","isles","Затерянная цивилизация","coast","zkslc","Забытый народ островов вновь увидел свет — и тьму. Мёртвые приплыли на костяных плотах.","Острова спасены."],["Море Сирен","sirens","Корона Королевы","coast","glkrc","Королева Сирен отдала корону в обмен на защиту жемчужных рифов. Нежить штурмует берег.","Рифы целы, корона снова на королеве."],["Вечное Море","eternal","Глубины","coast","zkslr","Глубины Вечного Моря полны ужасов, но эти — ужаснее: корабли-призраки выбросили на берег мертвецов.","Корабли-призраки пошли ко дну."],["Горы Бюн","byun","Перевал","mountain","kscrl","Три королевства Гор Бюн закрыли перевал. Но Жатва — не армия, а потоп: рыцари, сшивни и костелёты идут сверху и снизу.","Перевал держится."],["Златогорье","zlato","Золото Златогорья","gold","gzlkr","Король Финеган сидит на золотом троне и готов исполнить любое желание… за плату. Сегодня плата — защита золотых жил.","Финеган доволен: радуга над Златогорьем не погасла."],["Молотор","molotor","Кузница Молотора","mountain","zkscl","Король Дюрин поднял молоты. Дворфы держат стены, но кузницы нужны нам — не дайте мёртвым потушить горн.","Горн Молотора пылает."],["Флюкс","flux","Изобретение Флюкса","arcane","rrccl","Технобарон Гримли запустил дронов, стреляющих лазерами. Но небо принадлежит костелётам — а они не боятся лазеров.","Гримли доволен: «Лазеры — это главное!»"],["Квель-Сидай","quel","Золотой город","heaven","rcklg","Золотой город вечных эльфов парит среди облаков. Тьма поднимается к нему по лестницам из мёртвых.","Эльфы Квель-Сидая спасены."],["Квель-Сидай","quel","Тень Аванура","heaven","rcklsz","Потомки предателя Аванура шлют вести: Ксанвис предал и их. Эльфы не верят, но стены вот-вот падут.","Ложь рассеялась: враг у нас общий."],["Божественный Край","heavenly","Владыка Жнецов","heaven","rckl","Хранитель Врат пал, и Владыка Жнецов летит над Божественным Краем. Его крылья — кости, коса — собранные души.","Жнец рассыпался прахом. Врата очищены.","reaper"],["Поле Чудес","wonders","Путь Чемпиона","gold","gzlkscr","Восемь Печатей собраны. Поле Чудес — последний рубеж перед Императором. Но Ксанвис уже знает о вас.","Вы — чемпион Филакта. Но война не закончена."],["Манзанар","manzanar","Союз врагов","cave","zlksc","Тёмные эльфы Манзанара просят помощи. Враг моего врага — союзник, даже если он поклоняется Паучьей Богине.","Манзанар не пал. Тёмные эльфы в долгу."],["Немёртвые Земли","deadlands","Багровый поход","deadlands","gzkscr","Багрово-фиолетовое небо, мёртвые деревья и кости под ногами. Мы пришли отрезать Жатву от истока.","Передовой лагерь удержан."],["Немёртвые Земли","deadlands","Ворота Некрополя","deadlands","gzlkscrc","У ворот Некрополя нас встречает вся Жатва: упыри, зомби, личи, рыцари, сшивни, горгульи и костелёты.","Ворота Некрополя позади."],["Некрополь Личерон","necropolis","Костяные арки","necropolis","lkscrc","Могильные плиты, костяные арки, огни душ. Здесь Ксанвис собрал свою армию. Здесь она сломается.","Арки рухнули."],["Некрополь Личерон","necropolis","Сердце тьмы","necropolis","lkscrcz","Хален, Подземная Владычица, шепчет из глубины: «Он — моё дитя, но остановить его можете только вы».","Сердце тьмы дрогнуло. Ксанвис идёт на Ксарот."],["Ксарот","xarot","Осада начинается","meadow","gzlkscrc","Ксанвис обошёл все города и направил Жатву на Ксарот. Золотой дракон над воротами горит на закате.","Первая атака отбита."],["Ксарот","xarot","Падение стен","meadow","zlkscrc","Первая стена проломлена. Стражи Ксарота держатся, но ночь длинна, а мёртвых больше, чем звёзд.","Внешняя стена пала, но ворота стоят."],["Ксарот","xarot","Последняя ночь","meadow","lkkscrc","Рассвет близок. Нужно продержаться — и тогда Император-лич выйдет на бой сам.","Небо светлеет. Император идёт."],["Ксарот","xarot","Император-лич Ксанвис","meadow","gzlkscrc","Император-лич Ксанвис ступает на землю Ксарота. Против него — вы, золотой дракон и свет. Разрубите Жатву — ради Филакта!","Ксанвис рассыпался. Жатва окончена. Филакт свободен!","xanvis"]],n2=["hargh","malkrin","mordrein","reaper","xanvis"],mn=a2.map((a,i)=>{const s=i+1,f=a[7]??(s%10===0?n2[s/10-1]:void 0);return{id:s,act:Math.floor((s-1)/10),city:a[0],cityKey:a[1],title:a[2],biome:a[3],map:s===1?0:(s+Math.floor(s/6))%6,pool:a[4],story:a[5],win:a[6],boss:f,night:s>=47,ref:s<3?0:Math.min(8,1+Math.floor(s/7)),waves:f?Math.min(7,5+Math.floor(s/25)):Math.min(8,3+Math.floor(s/8)),gold:150+s*9}});function yh(a){const i=a-1;return{speed:1.28+.0112*i,hp:1+.06*i+5e-4*i*i,dmg:1+.045*a,atk:1+.008*a,elite:a<8?0:Math.min(.34,.04+(a-8)*.0072),reward:1+.012*a,ramp:.035,wait:Math.max(7,14-a*.14),rank:Math.min(5,Math.ceil(a/10))}}const Ys={ghoul:1,zombie:2,lich:3,knight:5,stitch:6,gargoyle:2.5,copter:4},bh={g:"ghoul",z:"zombie",l:"lich",k:"knight",s:"stitch",r:"gargoyle",c:"copter"};function w0(a){return function(){a|=0,a=a+1831565813|0;let i=Math.imul(a^a>>>15,1|a);return i=i+Math.imul(i^i>>>7,61|i)^i,((i^i>>>14)>>>0)/4294967296}}function i2(a){const i=new Set(a.pool.split("").map(s=>bh[s]));return a.boss&&i.add(a.boss),Array.from(i)}function s2(a,i){const s=w0(a.id*7919+13),f=a.pool.split("").map(r=>bh[r]).sort((r,g)=>Ys[r]-Ys[g]),c=Math.max(.42,1.3-a.id*.017),m=[];let d=a.ref;for(let r=0;r<a.waves;r++)
